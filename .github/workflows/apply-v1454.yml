name: Apply v14.5.4 dead UI hotfix
on:
  push:
    branches:
      - 'fix/v14.5.4-dead-ui'
permissions:
  contents: write
jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-v1454]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<script src="app.js?v=14503"></script>
          <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=14503',{updateViaCache:'none'}).catch(()=>{}));}</script>'''.replace('          ','')
          new='''<script src="boot-guard.js?v=14504"></script>
          <script src="app.js?v=14504"></script>'''.replace('          ','')
          if old not in s:
              raise SystemExit('old script block not found')
          s=s.replace(old,new,1)
          s=s.replace('✓ v14.5.3 修正済み','✓ v14.5.3 / build 14504 起動保護',1)
          p.write_text(s)
          PY
      - name: Syntax tests
        run: |
          node --check app.js
          node --check boot-guard.js
          node --check sedori-ai.user.js
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: dead UI recovery build 14504"
          git push
