name: Build v14.6.4 cache-proof recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1464-cacheproof.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate unique Safari entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base = Path('fresh-1462.html').read_text(encoding='utf-8')
          s = base.replace('14.6.2', '14.6.4')

          # Make JavaScript-disabled state visible without relying on JavaScript.
          noscript = '''<noscript><div style="margin:12px 14px;padding:12px;border:2px solid #d8332a;border-radius:10px;background:#fff0ef;color:#b42318;font-weight:800">JavaScriptが無効のため起動できません。SafariのJavaScript設定を有効にしてから再読込してください。</div></noscript>'''
          if '<body>' not in s:
              raise SystemExit('body tag not found')
          s = s.replace('<body>', '<body>\n' + noscript, 1)

          # This probe runs BEFORE the main engine. It uses old/basic syntax only,
          # so Safari can show whether page JavaScript itself is executing.
          probe = r'''<script>
(function(){
  var b=document.getElementById('bootBanner');
  var st=document.getElementById('searchStatus');
  window.__SEDORI_JS_PROBE__=true;
  if(b){b.textContent='✓ v14.6.4 JavaScript実行OK・判定エンジン起動中…';b.className='okboot';}
  if(st){st.textContent='JavaScript実行OK。判定エンジンを起動しています…';st.className='status';}
  window.addEventListener('error',function(ev){
    var msg=(ev&&ev.message)?String(ev.message):'不明なJavaScriptエラー';
    var line=(ev&&ev.lineno)?(' / line '+ev.lineno):'';
    if(b){b.textContent='JavaScriptエラー：'+msg+line;b.className='errboot';}
    if(st){st.textContent='起動エラー：'+msg+line;st.className='status error';}
  });
})();
</script>
'''
          anchor = "<script>\n(()=>{'use strict';"
          if anchor not in s:
              raise SystemExit('engine script anchor not found')
          s = s.replace(anchor, probe + anchor, 1)

          # Require init completion, not just engine parse success.
          old_init = "setInterval(consume,1000);status(connected()?'準備完了。検索できます。':'Userscripts接続待ち…')}"
          new_init = "setInterval(consume,1000);status(connected()?'準備完了。検索できます。':'Userscripts接続待ち…');window.__SEDORI_INIT_OK__=true}"
          if old_init not in s:
              raise SystemExit('init completion anchor not found')
          s = s.replace(old_init, new_init, 1)

          old_verify = 'if(window.__SEDORI_ENGINE__){'
          if old_verify not in s:
              raise SystemExit('verify anchor not found')
          s = s.replace(old_verify, 'if(window.__SEDORI_ENGINE__&&window.__SEDORI_INIT_OK__){', 1)
          s = s.replace('判定エンジンを起動できませんでした。app.jsの読込を確認してください。', '判定エンジンを起動できませんでした。画面に出たJavaScriptエラーを確認してください。')
          s = s.replace('起動エラー：app.jsが実行されていません。', '起動エラー：判定エンジンの初期化が完了していません。')

          Path('fresh-1464.html').write_text(s, encoding='utf-8')

          index = '''<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102541">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="./manifest.webmanifest?v=1464">
<title>せどりAI v14.6.4</title>
<style>html,body{height:100%;margin:0;background:#f4f7fb;color:#142238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);background:#fff;border:1px solid #dce4ee;border-radius:16px;padding:24px;box-sizing:border-box;box-shadow:0 8px 30px rgba(16,37,65,.08)}h1{margin:0 0 8px;font-size:24px}.status{margin:12px 0;padding:12px;border-radius:10px;background:#eaf8ef;border:1px solid #9bd6ad;color:#126b35;font-weight:800}.small{font-size:13px;line-height:1.7;color:#68758a}a{display:block;margin-top:16px;padding:13px 16px;border-radius:10px;background:#1473e6;color:#fff;text-align:center;text-decoration:none;font-weight:850}</style>
</head>
<body>
<main><div class="card"><h1>せどりAI v14.6.4</h1><div id="status" class="status">新しい起動ファイルへ切り替えています…</div><div class="small">v14.6.2 のキャッシュを使わず、別ファイル名の v14.6.4 を直接起動します。</div><a href="./fresh-1464.html?direct=1">v14.6.4 を直接開く</a><noscript><div class="small">JavaScriptが無効です。上のボタンから v14.6.4 を直接開けます。</div></noscript></div></main>
<script>
(function(){
  var target='./fresh-1464.html?from=index&v=1464-20260906';
  var done=false;
  function go(){if(done)return;done=true;window.location.replace(target);}
  try{
    if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(regs){var a=[];for(var i=0;i<regs.length;i++){try{a.push(regs[i].unregister());}catch(e){}}return Promise.all(a);}).then(go).catch(go);
      setTimeout(go,1200);
    }else{setTimeout(go,30);}
  }catch(e){setTimeout(go,30);}
})();
</script>
</body>
</html>
'''
          Path('index.html').write_text(index, encoding='utf-8')

          launch = index.replace('from=index', 'from=launcher').replace('新しい起動ファイルへ切り替えています…', 'Safariキャッシュを解除して v14.6.4 を起動しています…')
          Path('launch-v1464.html').write_text(launch, encoding='utf-8')

          manifest = {
            'name':'せどりAIエージェント',
            'short_name':'せどりAI',
            'start_url':'./launch-v1464.html?homescreen=1',
            'display':'standalone',
            'background_color':'#f4f7fb',
            'theme_color':'#102541',
            'lang':'ja',
            'icons':[
              {'src':'icons/icon-192.png','sizes':'192x192','type':'image/png'},
              {'src':'icons/icon-512.png','sizes':'512x512','type':'image/png'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Validate generated startup
        shell: bash
        run: |
          grep -F 'v14.6.4 JavaScript実行OK' fresh-1464.html
          grep -F 'window.__SEDORI_INIT_OK__=true' fresh-1464.html
          grep -F 'fresh-1464.html' index.html
          grep -F 'launch-v1464.html' manifest.webmanifest
          python - <<'PY'
          from pathlib import Path
          import re
          for html in ['fresh-1464.html','index.html','launch-v1464.html']:
              text=Path(html).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>', text, flags=re.S|re.I)
              for i,code in enumerate(scripts):
                  Path(f'/tmp/{Path(html).stem}-{i}.js').write_text(code, encoding='utf-8')
          PY
          for f in /tmp/fresh-1464-*.js /tmp/index-*.js /tmp/launch-v1464-*.js; do node --check "$f"; done
      - name: Commit cache-proof recovery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fresh-1464.html index.html launch-v1464.html manifest.webmanifest
          git commit -m "fix: publish cache-proof v14.6.4 startup"
          git push
