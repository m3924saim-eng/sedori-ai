name: Test sedori AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check sedori-ai.user.js
          node --check sedori-ai.meta.js
          node --check test-v1460.js
      - name: Core smoke tests
        run: node test-v1460.js
      - name: Search bridge wiring
        run: |
          grep -F "function start(" app.js
          grep -F "cmd('search'" app.js
          grep -F 'bulkSearchBtn' app.js
          grep -F 'sedoriBridgeCommand' sedori-ai.user.js
          grep -F 'sedoriBridgeResult' sedori-ai.user.js
      - name: Version and cache consistency
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          av=re.search(r"VERSION='([^']+)'",app)
          iv=re.search(r'<title>せどりAI v([^<]+)</title>',idx)
          if not av or not iv: raise SystemExit('version marker missing')
          if av.group(1)!=iv.group(1): raise SystemExit(f'version mismatch app={av.group(1)} index={iv.group(1)}')
          digits=av.group(1).replace('.','')
          if f'app.js?v={digits}' not in idx: raise SystemExit('index cache buster mismatch')
          if f"sedori-ai-v{digits}" not in sw: raise SystemExit('service worker cache mismatch')
          if f'./app.js?v={digits}' not in sw: raise SystemExit('service worker app cache mismatch')
          print('version/cache OK',av.group(1))
          PY
