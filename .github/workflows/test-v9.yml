name: Test sedori AI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Userscript syntax
        run: node --check sedori-ai.user.js
      - name: Single-file app syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('fresh-1467.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('fresh-1467 inline script not found')
          for i,code in enumerate(scripts):
              Path(f'/tmp/sedori-inline-{i}.js').write_text(code, encoding='utf-8')
          PY
          for f in /tmp/sedori-inline-*.js; do node --check "$f"; done
      - name: Current release smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          page=Path('fresh-1467.html').read_text(encoding='utf-8')
          user=Path('sedori-ai.user.js').read_text(encoding='utf-8')
          checks={
            'index route':'fresh-1467.html?v=1467-' in idx,
            'engine version':"VERSION='14.6.7'" in page,
            'search button':'bulkSearchBtn' in page,
            'search command':"cmd('search'" in page,
            'bridge result':'sedoriBridgeResult' in page,
            'engine marker':'window.__SEDORI_ENGINE__' in page,
            'settings restore':'loadSettingsUI' in page,
            'context restore':'restoreContext' in page,
            'image data':'image:item.image' in page,
            'image markup':r'class=\"thumb\"' in page,
            'userscript image capture':'image:img' in user,
          }
          for name,ok in checks.items():
              if not ok:
                  raise SystemExit('failed: '+name)
          for label in ['メルカリ','Yahoo!フリマ','ジモティー','Yahoo!オークション','楽天ラクマ']:
              if label not in page:
                  raise SystemExit('missing site: '+label)
          print('v14.6.7 smoke OK')
          PY
