name: Test sedori AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check sedori-ai.user.js
          node --check sedori-ai.meta.js
          node --check test-v1460.js
      - name: Core smoke tests
        run: node test-v1460.js
      - name: Search bridge wiring
        run: |
          grep -F "function start(" app.js
          grep -F "cmd('search'" app.js
          grep -F 'bulkSearchBtn' app.js
          grep -F 'sedoriBridgeCommand' sedori-ai.user.js
          grep -F 'sedoriBridgeResult' sedori-ai.user.js
      - name: Startup architecture consistency
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          app = Path('app.js').read_text(encoding='utf-8')
          idx = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')

          av = re.search(r"VERSION='([^']+)'", app)
          if not av:
              raise SystemExit('app version marker missing')

          # index.html is now only a cache-proof launcher. It may have a shell
          # version newer than the engine version, so do not require equality.
          target = re.search(r"target=['\"]\.\/([^?'\"]+)", idx)
          if not target:
              raise SystemExit('cache-proof startup target missing')
          startup = Path(target.group(1))
          if not startup.exists():
              raise SystemExit(f'startup file missing: {startup}')

          shell = startup.read_text(encoding='utf-8')
          if './app.js?v=' not in shell:
              raise SystemExit('startup page does not load app.js with cache buster')
          if 'boot-v1461.js' not in shell:
              raise SystemExit('startup page does not load boot monitor')
          if 'window.__SEDORI_ENGINE__' not in shell:
              raise SystemExit('startup page does not verify engine startup')

          # sw.js is intentionally a retiring worker: it clears stale caches,
          # unregisters itself, and forces network-only while old tabs remain.
          for marker in ['caches.keys()', 'registration.unregister()', "cache: 'no-store'"]:
              if marker not in sw:
                  raise SystemExit(f'retiring service worker marker missing: {marker}')

          print('startup architecture OK', 'engine='+av.group(1), 'shell='+startup.name)
          PY
