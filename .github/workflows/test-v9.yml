name: Test sedori AI v14

on:
  push:
    paths:
      - 'app.js'
      - 'boot-status.js'
      - 'runtime-fix-v14.1.js'
      - 'index.html'
      - 'sw.js'
      - 'sedori-ai.user.js'
      - 'test-v13.js'
      - '.github/workflows/test-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check boot-status.js
          node --check runtime-fix-v14.1.js
          node --check sedori-ai.user.js
          node --check sw.js
          node --check test-v13.js
      - name: v14 regression tests
        run: node test-v13.js
      - name: v14.1 asset/version consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('sw.js').read_text(encoding='utf-8')
          boot=Path('boot-status.js').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          hotfix=Path('runtime-fix-v14.1.js').read_text(encoding='utf-8')
          userscript=Path('sedori-ai.user.js').read_text(encoding='utf-8')
          checks={
            'base engine version': "const VERSION='14.0.0';" in app,
            'runtime ui version': "UI_VERSION='14.1.0'" in boot,
            'runtime module version': "const VERSION='14.1.0';" in hotfix,
            'selftest bridge': '__SEDORI_SELFTEST__' in app and '__SEDORI_SELFTEST__' in boot,
            'hotfix loader': 'runtime-fix-v14.1.js?v=14100' in boot,
            'service worker cache': "const CACHE='sedori-ai-v14100';" in sw,
            'service worker app': './app.js?v=14000' in sw,
            'service worker hotfix': './runtime-fix-v14.1.js?v=14100' in sw,
            'userscript version': '// @version      4.2.0' in userscript,
            'login recheck job': 'sedori_login_job_v42' in userscript,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('consistency checks failed: '+', '.join(failed))
          print('v14.1 consistency checks passed')
          PY
