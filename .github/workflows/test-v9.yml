name: Test sedori AI v14

on:
  push:
    paths:
      - 'app.js'
      - 'boot-status.js'
      - 'runtime-fix-v14.1.js'
      - 'index.html'
      - 'sw.js'
      - 'sedori-ai.user.js'
      - 'test-v13.js'
      - '.github/workflows/test-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check boot-status.js
          node --check runtime-fix-v14.1.js
          node --check sedori-ai.user.js
          node --check sw.js
          node --check test-v13.js
      - name: v14 regression tests
        run: node test-v13.js
      - name: v14.2 asset and login consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('sw.js').read_text(encoding='utf-8')
          boot=Path('boot-status.js').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          hotfix=Path('runtime-fix-v14.1.js').read_text(encoding='utf-8')
          userscript=Path('sedori-ai.user.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          checks={
            'base engine version': "const VERSION='14.0.0';" in app,
            'runtime ui version': "UI_VERSION='14.2.0'" in boot,
            'runtime module version': "const VERSION='14.2.0';" in hotfix,
            'selftest bridge': '__SEDORI_SELFTEST__' in app and '__SEDORI_SELFTEST__' in boot,
            'hotfix loader': 'runtime-fix-v14.1.js?v=14200' in boot,
            'index hotfix': 'runtime-fix-v14.1.js?v=14200' in index,
            'service worker cache': "const CACHE='sedori-ai-v14200';" in sw,
            'service worker hotfix': './runtime-fix-v14.1.js?v=14200' in sw,
            'service worker userscript': './sedori-ai.user.js?v=430' in sw,
            'userscript version': '// @version      4.3.0' in userscript,
            'content injection': '// @inject-into  content' in userscript,
            'tab bridge grants': '// @grant        GM.getTab' in userscript and '// @grant        GM.saveTab' in userscript,
            'fresh login report': 'sedori_login_report_v43' in userscript,
            'login job': 'sedori_login_job_v43' in userscript,
            'unsupported listener removed': 'GM.addValueChangeListener' not in userscript,
            'direct v4.3 link': 'sedori-ai.user.js?v=430' in index,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('consistency checks failed: '+', '.join(failed))
          print('v14.2 consistency checks passed')
          PY
