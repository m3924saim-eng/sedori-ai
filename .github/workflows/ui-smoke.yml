name: UI smoke test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jsdom
        run: npm install --no-save jsdom@26
      - name: Run UI smoke test
        run: node test-ui-smoke.mjs
