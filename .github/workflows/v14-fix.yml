name: One-time v14.4 Safari consistency fix

on:
  push:
    paths:
      - '.github/workflows/v14-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch v14.4.2 files
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          replace('index.html', [
              ('v14.3.0', 'v14.4.2'),
              ('app.js?v=14000', 'app.js?v=14402'),
              ('boot-status.js?v=14300', 'boot-status.js?v=14402'),
              ('runtime-fix-v14.1.js?v=14300', 'runtime-fix-v14.1.js?v=14402'),
              ('./sw.js?v=14300', './sw.js?v=14402'),
          ])

          replace('boot-status.js', [
              ("UI_VERSION='14.4.1'", "UI_VERSION='14.4.2'"),
              ("runtime-fix-v14.1.js?v=14401", "runtime-fix-v14.1.js?v=14402"),
          ])

          replace('runtime-fix-v14.1.js', [
              ("const VERSION='14.4.0';", "const VERSION='14.4.2';"),
          ])

          replace('reset.html', [
              ('fresh=14401', 'fresh=14402'),
          ])

          sw = [
              "const CACHE='sedori-ai-v14402';",
              "const PREFIX='sedori-ai-v';",
              "const ASSETS=['./','./index.html','./app.js?v=14402','./boot-status.js?v=14402','./runtime-fix-v14.1.js?v=14402','./sedori-ai.user.js','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png','./icons/icon-180.png'];",
              "",
              "self.addEventListener('install',event=>{",
              "  event.waitUntil((async()=>{",
              "    const cache=await caches.open(CACHE);",
              "    await Promise.all(ASSETS.map(async url=>{",
              "      try{",
              "        const response=await fetch(url,{cache:'reload'});",
              "        if(response.ok) await cache.put(url,response.clone());",
              "      }catch(_){ }",
              "    }));",
              "    await self.skipWaiting();",
              "  })());",
              "});",
              "",
              "self.addEventListener('activate',event=>{",
              "  event.waitUntil((async()=>{",
              "    const keys=await caches.keys();",
              "    await Promise.all(keys.filter(k=>k.startsWith(PREFIX)&&k!==CACHE).map(k=>caches.delete(k)));",
              "    await self.clients.claim();",
              "  })());",
              "});",
              "",
              "self.addEventListener('fetch',event=>{",
              "  const req=event.request;",
              "  if(req.method!=='GET') return;",
              "  event.respondWith((async()=>{",
              "    try{",
              "      const response=await fetch(req,{cache:'no-store'});",
              "      if(response.ok) return response;",
              "      if(req.mode!=='navigate') return response;",
              "    }catch(_){ }",
              "    if(req.mode==='navigate'){",
              "      return (await caches.match('./index.html',{ignoreSearch:true})) || Response.error();",
              "    }",
              "    return (await caches.match(req,{ignoreSearch:true})) || Response.error();",
              "  })());",
              "});",
          ]
          Path('sw.js').write_text('\n'.join(sw) + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check app.js
          node --check boot-status.js
          node --check runtime-fix-v14.1.js
          node --check sw.js
          node test-v13.js
          grep -q "v14.4.2" index.html
          grep -q "app.js?v=14402" index.html
          grep -q "boot-status.js?v=14402" index.html
          grep -q "runtime-fix-v14.1.js?v=14402" index.html
          grep -q "sw.js?v=14402" index.html
          grep -q "sedori-ai-v14402" sw.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html boot-status.js runtime-fix-v14.1.js reset.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix Safari stale cache and v14.4 boot consistency"
            git push
          fi
