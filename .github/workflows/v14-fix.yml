name: One-time v14.4.3 blank-screen fix

on:
  push:
    paths:
      - '.github/workflows/v14-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch v14.4.3 cache-busted entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          replace('index.html', [
              ('v14.4.2', 'v14.4.3'),
              ('?v=14402', '?v=14403'),
          ])

          replace('reset.html', [
              ('fresh=14402', 'fresh=14403'),
          ])

          sw = [
              "const CACHE='sedori-ai-v14403';",
              "const PREFIX='sedori-ai-v';",
              "const ASSETS=['./','./index.html','./app.js?v=14403','./boot-status.js?v=14403','./runtime-fix-v14.1.js?v=14403','./sedori-ai.user.js','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png','./icons/icon-180.png'];",
              "",
              "self.addEventListener('install',event=>{",
              "  event.waitUntil((async()=>{",
              "    const cache=await caches.open(CACHE);",
              "    await Promise.all(ASSETS.map(async url=>{",
              "      try{",
              "        const response=await fetch(url,{cache:'reload'});",
              "        if(response.ok) await cache.put(url,response.clone());",
              "      }catch(_){ }",
              "    }));",
              "    await self.skipWaiting();",
              "  })());",
              "});",
              "",
              "self.addEventListener('activate',event=>{",
              "  event.waitUntil((async()=>{",
              "    const keys=await caches.keys();",
              "    await Promise.all(keys.filter(k=>k.startsWith(PREFIX)&&k!==CACHE).map(k=>caches.delete(k)));",
              "    await self.clients.claim();",
              "  })());",
              "});",
              "",
              "self.addEventListener('fetch',event=>{",
              "  const req=event.request;",
              "  if(req.method!=='GET') return;",
              "  event.respondWith((async()=>{",
              "    try{",
              "      const response=await fetch(req,{cache:'no-store'});",
              "      if(response.ok) return response;",
              "      if(req.mode!=='navigate') return response;",
              "    }catch(_){ }",
              "    if(req.mode==='navigate'){",
              "      return (await caches.match('./index.html',{ignoreSearch:true})) || Response.error();",
              "    }",
              "    return (await caches.match(req,{ignoreSearch:true})) || Response.error();",
              "  })());",
              "});",
          ]
          Path('sw.js').write_text('\n'.join(sw) + '\n', encoding='utf-8')
          PY

      - name: Validate runtime and regression guards
        run: |
          node --check app.js
          node --check boot-status.js
          node --check runtime-fix-v14.1.js
          node --check sw.js
          node test-v13.js
          python - <<'PY'
          from pathlib import Path
          idx = Path('index.html').read_text(encoding='utf-8')
          rt = Path('runtime-fix-v14.1.js').read_text(encoding='utf-8')
          boot = Path('boot-status.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'v14.4.3' in idx
          assert 'app.js?v=14403' in idx
          assert 'boot-status.js?v=14403' in idx
          assert 'runtime-fix-v14.1.js?v=14403' in idx
          assert 'sw.js?v=14403' in idx
          assert "__SEDORI_RUNTIME_FIX_ACTIVE__" in rt
          assert 'MutationObserver' not in rt
          assert "replace(/Panel$/,'')" in rt
          assert "UI_VERSION='14.4.3'" in boot
          assert "runtime-fix-v14.1.js?v=14403" in boot
          assert "sedori-ai-v14403" in sw
          print('v14.4.3 regression checks: PASS')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reset.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Publish v14.4.3 blank-screen fix"
            git push
          fi
