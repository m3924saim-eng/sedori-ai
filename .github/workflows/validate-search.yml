name: Validate search startup
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check sedori-ai.user.js
      - name: Critical search wiring
        shell: bash
        run: |
          grep -F 'function start()' app.js
          grep -F 'bulkSearchBtn' app.js
          grep -F "command('search'" app.js
          grep -F 'sedoriBridgeCommand' sedori-ai.user.js
          grep -F 'app.js?v=' index.html
      - name: Version consistency
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          app=pathlib.Path('app.js').read_text()
          idx=pathlib.Path('index.html').read_text()
          av=re.search(r"VERSION='([^']+)'", app)
          iv=re.search(r'せどりAI <small[^>]*>v([^<]+)</small>', idx)
          if not av or not iv:
              raise SystemExit('version not found')
          if av.group(1) != iv.group(1):
              raise SystemExit(f'version mismatch: app={av.group(1)} index={iv.group(1)}')
          print('version OK:', av.group(1))
          PY
