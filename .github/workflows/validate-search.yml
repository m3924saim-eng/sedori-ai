name: Validate search startup
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check sedori-ai.user.js
          node --check test-v1460.js
      - name: Critical search wiring
        shell: bash
        run: |
          grep -F 'function start(' app.js
          grep -F 'bulkSearchBtn' app.js
          grep -F "cmd('search'" app.js
          grep -F 'sedoriBridgeCommand' sedori-ai.user.js
          grep -F 'sedoriBridgeResult' sedori-ai.user.js
          grep -F 'fresh-1464.html' index.html
          grep -F 'app.js?v=1464' fresh-1464.html
          grep -F 'boot-v1461.js?v=1464' fresh-1464.html
          grep -F 'window.__SEDORI_ENGINE__' fresh-1464.html
          grep -F 'v14.6.4 JavaScript実行OK' fresh-1464.html
          grep -F 'メルカリ' fresh-1464.html
          grep -F 'Yahoo!フリマ' fresh-1464.html
          grep -F 'ジモティー' fresh-1464.html
          grep -F 'Yahoo!オークション' fresh-1464.html
          grep -F '楽天ラクマ' fresh-1464.html
      - name: Functional smoke test
        run: node test-v1460.js
      - name: Release and cache safety
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          app=pathlib.Path('app.js').read_text()
          idx=pathlib.Path('index.html').read_text()
          page=pathlib.Path('fresh-1464.html').read_text()
          sw=pathlib.Path('sw.js').read_text()
          av=re.search(r"VERSION='([^']+)'", app)
          rv=re.search(r"__SEDORI_SHELL_VERSION__='([^']+)'", page)
          if not av:
              raise SystemExit('engine version not found')
          if not rv or rv.group(1) != '14.6.4':
              raise SystemExit(f'v14.6.4 release shell not found: {rv.group(1) if rv else "missing"}')
          if 'fresh-1464.html' not in idx:
              raise SystemExit('index is not routed to fresh-1464.html')
          if 'app.js?v=1464' not in page:
              raise SystemExit('cache-busted app.js reference missing')
          if 'registration.unregister' not in sw or "cache: 'no-store'" not in sw:
              raise SystemExit('retired service worker safety check failed')
          print('release OK: shell=14.6.4 engine='+av.group(1))
          PY
