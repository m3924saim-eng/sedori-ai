name: Validate search startup
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check sedori-ai.user.js
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('fresh-1467.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('fresh-1467 inline script not found')
          for i,code in enumerate(scripts):
              Path(f'/tmp/fresh-1467-{i}.js').write_text(code, encoding='utf-8')
          PY
          for f in /tmp/fresh-1467-*.js; do node --check "$f"; done
      - name: Critical search wiring
        shell: bash
        run: |
          grep -F 'fresh-1467.html' index.html
          grep -F "VERSION='14.6.7'" fresh-1467.html
          grep -F 'bulkSearchBtn' fresh-1467.html
          grep -F "cmd('search'" fresh-1467.html
          grep -F 'sedoriBridgeCommand' fresh-1467.html
          grep -F 'sedoriBridgeResult' fresh-1467.html
          grep -F 'window.__SEDORI_ENGINE__' fresh-1467.html
          grep -F 'loadSettingsUI' fresh-1467.html
          grep -F 'image:item.image' fresh-1467.html
          grep -F 'メルカリ' fresh-1467.html
          grep -F 'Yahoo!フリマ' fresh-1467.html
          grep -F 'ジモティー' fresh-1467.html
          grep -F 'Yahoo!オークション' fresh-1467.html
          grep -F '楽天ラクマ' fresh-1467.html
          grep -F 'sedoriBridgeCommand' sedori-ai.user.js
          grep -F 'sedoriBridgeResult' sedori-ai.user.js
          grep -F 'image:img' sedori-ai.user.js
      - name: Release and cache safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          page=Path('fresh-1467.html').read_text(encoding='utf-8')
          if 'fresh-1467.html?v=1467-' not in idx:
              raise SystemExit('index is not routed to cache-busted fresh-1467.html')
          if '<title>せどりAI v14.6.7</title>' not in page:
              raise SystemExit('v14.6.7 title missing')
          if "VERSION='14.6.7'" not in page:
              raise SystemExit('v14.6.7 engine marker missing')
          if 'serviceWorker.register' in page:
              raise SystemExit('single-file release must not register a service worker')
          print('release OK: v14.6.7 single-file build')
          PY
