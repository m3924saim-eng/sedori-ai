<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102541">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>せどりAI v14.6.6</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#f4f7fb;color:#142238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#102541;color:#fff;padding:14px 18px}.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.head h1{margin:0;font-size:25px}.head p{margin:3px 0 0;font-size:12px;color:#d7e1ee}.chip{padding:8px 11px;border-radius:999px;background:#12375a;font-size:12px;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:12px 14px 90px}.boot{padding:11px 13px;border:1px solid #9bd6ad;background:#eaf8ef;color:#126b35;border-radius:10px;margin-bottom:10px;font-weight:800;font-size:13px}.panel{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:14px;margin-bottom:12px}.sites{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.site{background:#fff;border:1px solid #dce4ee;border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:800}.filters{display:grid;grid-template-columns:2.2fr 1fr .7fr .7fr 1.2fr 1fr;gap:10px}label{display:block;color:#68758a;font-size:11px;margin:0 0 4px}input,select{width:100%;padding:11px;border:1px solid #cdd7e4;border-radius:9px;background:#fff;font-size:15px}.searchrow{display:grid;grid-template-columns:1fr 310px;gap:12px;align-items:end;margin-top:10px}.toggles{display:flex;gap:16px;flex-wrap:wrap}.toggles label{display:flex;gap:6px;align-items:center;color:#142238;font-size:12px;margin:0}.toggles input{width:auto}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:850}.primary{background:#1473e6;color:#fff}.full{width:100%}.status{font-size:12px;color:#68758a;margin-top:9px;min-height:18px}.error{color:#d8332a;font-weight:800}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}.sum{background:#fff;border:1px solid #dce4ee;border-radius:12px;padding:13px}.sum small{display:block;color:#68758a}.sum b{font-size:23px}.result{background:#fff;border:1px solid #dce4ee;border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:2fr .8fr 1fr 1fr 1fr .8fr;border-top:1px solid #edf1f5}.row:first-child{border-top:0}.cell{padding:11px;min-width:0}.muted{font-size:11px;color:#68758a;line-height:1.5}.buy{color:#078651}.hold{color:#e27817}.watch{color:#c46b00}.pass{color:#d8332a}.hide{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);border-top:1px solid #dce4ee;padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;gap:8px}nav button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:850}nav .active{background:#dbeafe;color:#1d4ed8}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.searchrow{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.sites{grid-template-columns:repeat(2,1fr)}.row{display:block}.cell{padding:8px 12px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🛒 せどりAI <small style="font-size:12px">v14.6.6</small></h1><p>Safari白画面対策・単一HTML起動版</p></div><div class="chip" id="bridgeChip">● Userscripts 確認中</div></div></header>
<div class="wrap">
<div class="boot" id="bootBanner">✓ HTML・判定エンジン起動完了</div>
<section id="searchPanel">
<div class="sites"><div class="site">✓ メルカリ</div><div class="site">✓ Yahoo!フリマ</div><div class="site">✓ ジモティー</div><div class="site">✓ Yahoo!オークション</div><div class="site">✓ 楽天ラクマ</div></div>
<div class="panel"><div class="filters"><div><label>ブランド・商品名・型番</label><input id="searchQ" placeholder="例：カルティエ ラブリング K18 11号"></div><div><label>カテゴリ</label><select id="searchCategory"><option value="all">すべて</option><option>アクセサリー</option><option>財布</option><option>バッグ</option><option>家電・デジタル</option></select></div><div><label>最低価格</label><input id="searchMin" type="number" value="0"></div><div><label>最高価格</label><input id="searchMax" type="number" value="45000"></div><div><label>商品の状態</label><select id="searchCondition"><option value="all">すべて</option><option value="new">新品・未使用</option><option value="good" selected>目立つ傷や汚れなし以上</option><option value="used">傷や汚れありを含む</option></select></div><div><label>並び順</label><select id="searchSort"><option value="newest">新着順</option><option value="price_asc">価格の安い順</option><option value="price_desc">価格の高い順</option></select></div></div><div class="searchrow"><div class="toggles"><label><input id="searchOnSale" type="checkbox" checked>販売中のみ</label><label><input id="searchExcludeAds" type="checkbox" checked>広告・業者枠を除外</label></div><button id="bulkSearchBtn" class="btn primary full">🔎 5サイトを一括検索</button></div><div id="searchStatus" class="status">起動完了。Userscripts接続を確認しています…</div></div>
<div id="summary" class="summary hide"></div><div id="candidateResults" class="result hide"></div>
</section>
<section id="judgePanel" class="hide"><div class="panel"><h2>詳細判定</h2><p class="muted">検索結果から確認します。</p></div></section>
<section id="historyPanel" class="hide"><div class="panel"><h2>保存候補</h2><p class="muted">検索履歴は端末内へ保存します。</p></div></section>
<section id="settingsPanel" class="hide"><div class="panel"><h2>設定</h2><div class="filters"><div><label>最低純利益</label><input id="minProfit" type="number" value="3000"></div><div><label>最低ROI</label><input id="minRoi" type="number" value="30"></div><div><label>要確認利益</label><input id="watchProfit" type="number" value="1500"></div><div><label>要確認ROI</label><input id="watchRoi" type="number" value="15"></div><div><label>送料</label><input id="shippingCost" type="number" value="750"></div><div><label>販売先</label><select id="saleSite"><option value="mercari">メルカリ</option><option value="yahoo_fleamarket">Yahoo!フリマ</option><option value="rakuma">楽天ラクマ</option><option value="yahoo_auction">Yahoo!オークション</option><option value="jmty">ジモティー</option></select></div></div><button id="saveSettingsBtn" class="btn primary" style="margin-top:10px">設定保存</button><button id="checkLoginBtn" class="btn" style="margin-top:10px">5サイトのログイン状態を確認</button></div></section>
</div>
<nav><button class="active" data-tab="search">検索</button><button data-tab="judge">判定</button><button data-tab="history">候補</button><button data-tab="settings">設定</button></nav>
<script>
(function(){
'use strict';
var VERSION='14.6.6',K='sedori_settings_v1466',HK='sedori_market_history_v1466',CK='sedori_search_context_v1466',TIMEOUT=70000,timer=null,active=false;
var siteNames={mercari:'メルカリ',rakuma:'楽天ラクマ',yahoo_fleamarket:'Yahoo!フリマ',yahoo_auction:'Yahoo!オークション',jmty:'ジモティー'};
var fees={mercari:0.10,yahoo_fleamarket:0.05,rakuma:0.10,yahoo_auction:0.10,jmty:0};
function el(id){return document.getElementById(id)}
function num(v){var n=Number(v);return isFinite(n)?n:0}
function yen(v){return '¥'+Math.round(num(v)).toLocaleString('ja-JP')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function read(k,d){try{var x=localStorage.getItem(k);return x==null?d:JSON.parse(x)}catch(e){return d}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function status(t,err){var s=el('searchStatus');if(s){s.textContent=t;s.className='status'+(err?' error':'')}}
function bridgeVersion(){var d=document.documentElement&&document.documentElement.dataset?document.documentElement.dataset.sedoriUserscript:'';return d||''}
function updateBridge(){var v=bridgeVersion(),c=el('bridgeChip');if(c)c.textContent=v?'● Userscripts v'+v+' 接続済み':'● Userscripts 未接続';return !!v}
function filters(){return {query:(el('searchQ').value||'').replace(/^\s+|\s+$/g,''),min:num(el('searchMin').value),max:num(el('searchMax').value),condition:el('searchCondition').value,sort:el('searchSort').value,onSale:el('searchOnSale').checked,excludeAds:el('searchExcludeAds').checked,maxPerSite:50}}
function settings(){var d={minProfit:3000,minRoi:30,watchProfit:1500,watchRoi:15,saleSite:'mercari',shippingCost:750},x=read(K,{}),k;for(k in x)d[k]=x[k];d.minProfit=num(el('minProfit').value);d.minRoi=num(el('minRoi').value);d.watchProfit=num(el('watchProfit').value);d.watchRoi=num(el('watchRoi').value);d.shippingCost=num(el('shippingCost').value);d.saleSite=el('saleSite').value;return d}
function saveSettings(){write(K,settings());status('設定を保存しました。',false)}
function cmd(type,payload){var old=el('sedoriBridgeCommand');if(old&&old.parentNode)old.parentNode.removeChild(old);var n=document.createElement('div'),data={type:type,appVersion:VERSION,at:Date.now()},k;n.id='sedoriBridgeCommand';n.style.display='none';payload=payload||{};for(k in payload)data[k]=payload[k];n.textContent=JSON.stringify(data);document.documentElement.appendChild(n)}
function normalize(s){return String(s||'').toLowerCase().replace(/[\s\-_/()【】\[\]・,，.。]+/g,' ').replace(/^\s+|\s+$/g,'')}
function tokens(s){var a=normalize(s).split(' '),o=[],i;for(i=0;i<a.length;i++)if(a[i].length>1)o.push(a[i]);return o}
function score(a,b){var A=tokens(a),B=tokens(b),i,j,hit=0;if(!A.length||!B.length)return 0;for(i=0;i<A.length;i++){for(j=0;j<B.length;j++){if(A[i]===B[j]||A[i].indexOf(B[j])>=0||B[j].indexOf(A[i])>=0){hit++;break}}}return Math.round(hit/Math.max(A.length,B.length)*100)}
function quantile(a,q){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y}),i=Math.round((s.length-1)*q);return s[Math.max(0,Math.min(s.length-1,i))]}
function history(){var cut=Date.now()-180*86400000,a=read(HK,[]),o=[],i;for(i=0;i<a.length;i++)if(num(a[i].price)>0&&num(a[i].at)>=cut)o.push(a[i]);return o.slice(0,4000)}
function saveHistory(items,q){var a=history(),map={},out=[],i,k,id;for(i=0;i<a.length;i++){id=a[i].url||a[i].source+'|'+normalize(a[i].title)+'|'+a[i].price;map[id]=a[i]}for(i=0;i<items.length;i++){if(num(items[i].price)<=0)continue;id=items[i].url||items[i].source+'|'+normalize(items[i].title)+'|'+items[i].price;map[id]={source:items[i].source,title:items[i].title,price:num(items[i].price),url:items[i].url||'',query:q,at:Date.now()}}for(k in map)out.push(map[k]);out.sort(function(a,b){return num(b.at)-num(a.at)});write(HK,out.slice(0,4000))}
function market(item,items,q){var p=[],i,h,med,band=[],sell,conf;for(i=0;i<items.length;i++)if(items[i].url!==item.url&&num(items[i].price)>0&&score(item.title,items[i].title)>=55)p.push(num(items[i].price));if(p.length<2){h=history();for(i=0;i<h.length;i++)if(num(h[i].price)>0&&(score(item.title,h[i].title)>=60||score(q,h[i].title)>=60))p.push(num(h[i].price))}if(!p.length)return {sell:0,low:0,high:0,count:0,confidence:0};med=quantile(p,0.5);for(i=0;i<p.length;i++)if(p[i]>=med*0.55&&p[i]<=med*1.8)band.push(p[i]);if(band.length>=3)p=band;sell=Math.round(Math.min(quantile(p,0.35),quantile(p,0.5)*0.93)/100)*100;conf=Math.min(92,45+p.length*6);if(p.length===1)conf=42;if(p.length===2)conf=58;return {sell:sell,low:Math.round(quantile(p,0.25)/100)*100,high:Math.round(quantile(p,0.75)/100)*100,count:p.length,confidence:conf}}
function shipping(item){var t=(item.title||'')+' '+(item.rawText||'');if(/リング|指輪|ネックレス|ピアス|ブレスレット|カード|小物/i.test(t))return 230;if(/財布|キーケース|スマホ|iphone|ゲームソフト|香水|化粧品/i.test(t))return 450;if(/バッグ|靴|スニーカー|ジャケット|コート|デニム|パンツ|ニット|パーカー|シャツ/i.test(t))return 750;if(/工具|家電|ホイール|タイヤ/i.test(t))return 1200;return 750}
function judge(item,items,q){var s=settings(),m=market(item,items,q),buy=num(item.price),fee=Math.round(m.sell*(fees[s.saleSite]==null?0.10:fees[s.saleSite])),ship=shipping(item),profit=m.sell?Math.round(m.sell-fee-ship-buy):0,roi=buy?profit/buy*100:0,verdict='pass',reason='利益不足';if(!m.sell){verdict='watch';reason='比較データ不足'}else if(m.confidence<48){verdict='watch';reason='低信頼'}else if(profit>=s.minProfit&&roi>=s.minRoi&&m.count>=2){verdict='buy';reason='仕入基準到達'}else if(profit>=s.watchProfit&&roi>=s.watchRoi){verdict='hold';reason='利益余地あり'}if(roi>300){verdict='watch';reason='異常ROIのため要確認'}return {source:item.source,title:item.title||'商品名不明',url:item.url||'',buy:buy,sell:m.sell,low:m.low,high:m.high,count:m.count,confidence:m.confidence,fee:fee,shipping:ship,profit:profit,roi:roi,verdict:verdict,reason:reason}}
function row(x){var label={buy:'仕入候補',hold:'保留',watch:'要確認',pass:'見送り'}[x.verdict]||'要確認';return '<div class="row"><div class="cell"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.reason)+'</div></div><div class="cell"><b>'+esc(siteNames[x.source]||x.source)+'</b></div><div class="cell">仕入 '+yen(x.buy)+'<br><span class="muted">手数料 '+yen(x.fee)+' / 送料 '+yen(x.shipping)+'</span></div><div class="cell">予測 '+(x.sell?yen(x.sell):'不可')+'<br><span class="muted">'+(x.low?yen(x.low)+'〜'+yen(x.high):'-')+' / '+x.count+'件 / 信頼'+x.confidence+'</span></div><div class="cell">利益 '+yen(x.profit)+'<br><span class="muted">ROI '+Math.round(x.roi*10)/10+'%</span></div><div class="cell"><b class="'+x.verdict+'">'+label+'</b>'+(x.url?'<br><a href="'+esc(x.url)+'" target="_blank" rel="noopener">商品を見る</a>':'')+'</div></div>'}
function renderResult(data){var items=(data&&Object.prototype.toString.call(data.items)==='[object Array]')?data.items:[],ctx=read(CK,{query:''}),q=(data&&data.filters&&data.filters.query)||ctx.query||'',map={},u=[],rows=[],order={buy:0,hold:1,watch:2,pass:3},c={buy:0,hold:0,watch:0,pass:0},i,k,id,sum,out,pred=0;for(i=0;i<items.length;i++){id=items[i].url||items[i].source+'|'+normalize(items[i].title)+'|'+items[i].price;if(!map[id])map[id]=items[i]}for(k in map)u.push(map[k]);items=u;saveHistory(items,q);for(i=0;i<items.length;i++)rows.push(judge(items[i],items,q));rows.sort(function(a,b){return order[a.verdict]-order[b.verdict]||b.profit-a.profit});for(i=0;i<rows.length;i++){c[rows[i].verdict]++;if(rows[i].sell>0)pred++}sum=el('summary');sum.innerHTML='<div class="sum"><small>検索完了</small><b>'+rows.length+'</b></div><div class="sum"><small>仕入候補</small><b class="buy">'+c.buy+'</b></div><div class="sum"><small>要確認</small><b class="watch">'+c.watch+'</b></div><div class="sum"><small>保留</small><b class="hold">'+c.hold+'</b></div><div class="sum"><small>見送り</small><b class="pass">'+c.pass+'</b></div><div class="sum"><small>予測価格あり</small><b>'+pred+'</b></div>';sum.className='summary';out=el('candidateResults');out.innerHTML=rows.length?rows.map(row).join(''):'<div class="cell">結果なし</div>';out.className='result';el('bulkSearchBtn').disabled=false;active=false;if(timer)clearTimeout(timer);status('検索完了：'+items.length+'件 / 予測 '+pred+'件 / 仕入候補 '+c.buy+'件',false)}
function consume(){var er=el('sedoriBridgeError'),r,d,em;if(er){em='不明';try{em=JSON.parse(er.textContent||'{}').message||em}catch(e){}if(er.parentNode)er.parentNode.removeChild(er);el('bulkSearchBtn').disabled=false;active=false;status('検索エラー：'+em,true)}r=el('sedoriBridgeResult');if(r){d={};try{d=JSON.parse(r.textContent||'{}')}catch(e){}if(r.parentNode)r.parentNode.removeChild(r);renderResult(d)}updateBridge()}
function startSearch(){var f;if(!updateBridge()){status('Userscriptsが未接続です。Safariの拡張機能でUserscriptsをONにしてください。',true);return}f=filters();if(!f.query){status('商品名・型番を入力してください。',true);return}write(CK,f);active=true;el('bulkSearchBtn').disabled=true;status('5サイト検索を開始します…「'+f.query+'」',false);cmd('search',{filters:f});if(timer)clearTimeout(timer);timer=setTimeout(function(){if(active){active=false;el('bulkSearchBtn').disabled=false;status('70秒で待機解除しました。Userscripts側の結果を確認してください。',true)}},TIMEOUT)}
function loginCheck(){if(!updateBridge()){status('Userscriptsが未接続です。',true);return}status('5サイトのログイン確認を開始します…',false);cmd('login',{})}
function tabs(){var bs=document.querySelectorAll('nav button[data-tab]'),i;for(i=0;i<bs.length;i++)bs[i].onclick=function(){var name=this.getAttribute('data-tab'),ids=['search','judge','history','settings'],j;for(j=0;j<ids.length;j++)el(ids[j]+'Panel').className=(ids[j]===name?'':'hide');for(j=0;j<bs.length;j++)bs[j].className='';this.className='active'}}
function init(){var ctx=read(CK,null);window.__SEDORI_ENGINE__={version:VERSION};if(ctx&&ctx.query)el('searchQ').value=ctx.query;el('bulkSearchBtn').onclick=startSearch;el('searchQ').onkeydown=function(e){e=e||window.event;if((e.key&&e.key==='Enter')||e.keyCode===13)startSearch()};el('saveSettingsBtn').onclick=saveSettings;el('checkLoginBtn').onclick=loginCheck;tabs();if(window.MutationObserver)new MutationObserver(consume).observe(document.documentElement,{childList:true,subtree:true});setInterval(consume,700);status(updateBridge()?'準備完了。検索できます。':'画面起動済み。Userscripts接続待ちです。',false)}
try{init()}catch(e){el('bootBanner').textContent='起動エラー：'+String(e&&e.message?e.message:e);el('bootBanner').style.background='#fff0ef';el('bootBanner').style.borderColor='#ffb6b1';el('bootBanner').style.color='#b42318';status('起動エラー：'+String(e&&e.message?e.message:e),true)}
})();
</script>
</body>
</html>
