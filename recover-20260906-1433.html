<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>せどりAI 緊急修復</title>
<style>
html,body{min-height:100%;margin:0;background:#f4f7fb;color:#142238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:680px;margin:12vh auto 0;padding:24px}.card{background:#fff;border:1px solid #dce4ee;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(16,37,65,.08)}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7;margin:8px 0}.status{font-weight:800;color:#1473e6}.error{color:#b42318}.btn{display:inline-block;margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:#1473e6;color:#fff;font-size:16px;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="box"><div class="card"><h1>せどりAI 緊急修復</h1><p id="status" class="status">Safariの古いキャッシュを解除しています…</p><p>保存済みの設定データは削除しません。</p><a id="manual" class="btn" href="./index.html?recovery=202609061433">最新版を開く</a></div></div>
<script>
(function(){
  'use strict';
  var status=document.getElementById('status');
  var target='./index.html?recovery=202609061433-'+Date.now();
  document.getElementById('manual').href=target;
  function set(t,err){status.textContent=t;status.className=err?'status error':'status';}
  var jobs=[];
  try{
    if('serviceWorker' in navigator){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(reg){return reg.unregister().catch(function(){return false;});}));
      }));
    }
  }catch(e){}
  try{
    if(window.caches&&caches.keys){
      jobs.push(caches.keys().then(function(keys){
        return Promise.all(keys.filter(function(k){return String(k).indexOf('sedori-ai-')===0;}).map(function(k){return caches.delete(k).catch(function(){return false;});}));
      }));
    }
  }catch(e){}
  Promise.all(jobs).then(function(){
    set('修復完了。最新版へ移動します…',false);
    setTimeout(function(){location.replace(target);},350);
  }).catch(function(){
    set('自動修復の一部に失敗しました。下の「最新版を開く」を押してください。',true);
  });
})();
</script>
</body>
</html>
