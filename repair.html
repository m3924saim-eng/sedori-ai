<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>せどりAI 修復</title>
<style>body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142238}.wrap{max-width:720px;margin:12vh auto;padding:24px}.card{background:#fff;border:1px solid #dce4ee;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}h1{font-size:24px;margin:0 0 12px}.status{font-size:16px;line-height:1.7}.ok{color:#078651;font-weight:800}.err{color:#d8332a;font-weight:800}a{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:10px;background:#1473e6;color:#fff;text-decoration:none;font-weight:800}</style>
</head>
<body><div class="wrap"><div class="card"><h1>せどりAI Safari修復</h1><div id="status" class="status">古いキャッシュを解除しています…</div><a id="open" href="./?fresh=1460r1">せどりAIを開く</a></div></div>
<script>
(async()=>{
 const s=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('sedori-ai-v')).map(k=>caches.delete(k)));}
  s.textContent='修復完了。せどりAIを開き直します…';s.className='status ok';
  setTimeout(()=>location.replace('./?fresh=1460r1&t='+Date.now()),700);
 }catch(e){s.textContent='自動修復の一部に失敗しました。下のボタンから開き直してください。';s.className='status err';}
})();
</script></body></html>
