<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>せどりAI リセット</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6fa;color:#101828;padding:24px}main{max-width:560px;margin:auto;background:#fff;border-radius:18px;padding:22px;border:1px solid #e4e7ec}h1{font-size:22px}p{line-height:1.6}.ok{font-weight:800;color:#067647}</style></head><body><main><h1>せどりAIを復旧しています</h1><p id="s">古いキャッシュとService Workerを削除しています…</p></main><script>(async()=>{const s=document.getElementById('s');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}s.className='ok';s.textContent='リセット完了。最新版を開きます…';setTimeout(()=>location.replace('./?fresh=14403#search'),500)}catch(e){s.textContent='リセット処理を続行します…';setTimeout(()=>location.replace('./?fresh=14403#search'),800)}})();</script></body></html>
